<div class="pagina-admin">
  <app-sidebaradmin></app-sidebaradmin>

  <div class="contingut-admin">
    <h1 class="titol-dashboard">Dashboard d'Administració</h1>

    <!-- TARGETA DEL GRÀFIC DE BARRES -->
    <!-- Embolcallem el canvas en una targeta per poder controlar la mida -->
    <div class="targeta-grafic">
      <h2 class="titol-grafic">Assistència mensual</h2>

      <!--
        baseChart  → directiva de ng2-charts que activa el gràfic
        [data]     → les dades que hem definit al TypeScript (barData)
        [options]  → les opcions visuals (barOptions)
        [type]     → el tipus de gràfic: 'bar', 'line', 'pie', 'doughnut'...
      -->
      <div class="contenidor-canvas">
        <canvas baseChart
          [data]="barData"
          [options]="barOptions"
          [type]="'bar'">
        </canvas>
      </div>
    </div>
  </div>
</div>
