<div class="form-container">
  
  <div class="header-form">
    <h2>{{ esEdicio ? 'Editar Cicle Formatiu' : 'Nou Cicle Formatiu' }}</h2>
    <button class="btn-tornar" routerLink="/administracio/gestio-cicles">⬅ Tornar a la llista</button>
  </div>

  <form class="cicle-form" (ngSubmit)="guardarCicle()">
    
    <div class="form-group">
      <label for="nom">Nom del Cicle:</label>
      <input type="text" id="nom" [(ngModel)]="cicle.nom" name="nom" required placeholder="Ex: Desenvolupament d'Aplicacions Web">
    </div>

    <div class="form-group">
      <label for="tipus">Tipus:</label>
      <select id="tipus" [(ngModel)]="cicle.tipus" name="tipus" required>
        <option value="" disabled selected>Selecciona un tipus</option>
        <option value="GS">Grau Superior (GS)</option>
        <option value="GM">Grau Mitjà (GM)</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="id_tutor">ID Tutor (Opcional):</label>
        <input type="number" id="id_tutor" [(ngModel)]="cicle.id_tutor" name="id_tutor" placeholder="Ex: 1">
      </div>

      <div class="form-group">
        <label for="id_periode">ID Període (Opcional):</label>
        <input type="number" id="id_periode" [(ngModel)]="cicle.id_periode" name="id_periode" placeholder="Ex: 1">
      </div>
    </div>

    <button type="submit" class="btn-submit">
      {{ esEdicio ? 'Actualitzar Cicle' : 'Crear Cicle' }}
    </button>
  </form>
  
</div>
