<!-- 
  Pàgina de completar perfil.
  S'usa [(ngModel)] per fer el two-way binding amb els signals del TS.
  @if / @else és la nova sintaxi de blocs de control d'Angular 17+.
-->
<div class="fons-perfil">
  <div class="targeta-perfil">

    <div class="encapçalament-perfil">
      <h1>Completa el teu perfil</h1>
      <p>Necessitem unes dades addicionals per activar el teu compte</p>
    </div>

    <div class="cos-formulari">

      <!-- Data de naixement -->
      <div class="grup-input">
        <label for="dataNaixement">Data de naixement</label>
        <div class="input-wrapper">
          <input
            type="date"
            id="dataNaixement"
            [ngModel]="dataNaixement()"
            (ngModelChange)="dataNaixement.set($event)"
          >
        </div>
      </div>

      <!-- Correu dels pares (només si és menor d'edat) -->
      @if (esMenorEdat()) {
        <div class="grup-input">
          <label for="emailPares">Correu dels pares/tutors</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="emailPares"
              placeholder="correu@exemple.com"
              [ngModel]="emailPares()"
              (ngModelChange)="emailPares.set($event)"
            >
            <span class="icona-input">✉️</span>
          </div>
        </div>
      }

      <!-- Foto de perfil -->
      <div class="grup-input">
        <label>Foto de perfil</label>
        <div class="contenedor-foto">
          <div class="vista-previa">
            @if (photoPreview()) {
              <img [src]="photoPreview()" alt="Previsualització de la foto de perfil">
            } @else {
              <div class="placeholder-foto">
                <span aria-hidden="true">📷</span>
              </div>
            }
          </div>
          <label for="photoInput" class="boto-canviar-foto" role="button">
            Canviar foto
          </label>
          <input
            type="file"
            id="photoInput"
            accept="image/*"
            (change)="onFileSelected($event)"
            hidden
          >
        </div>
      </div>

      <!-- Missatge d'error -->
      @if (error()) {
        <div class="missatge-error" role="alert">
          <span aria-hidden="true">⚠️</span>
          <span>{{ error() }}</span>
        </div>
      }

      <!-- Botó guardar -->
      <button
        id="btn-guardar-perfil"
        (click)="guardar()"
        class="boto-guardar"
        [disabled]="carregant()"
        type="button"
      >
        @if (carregant()) {
          <span class="carregant-spinner" aria-hidden="true"></span>
          <span>Guardant...</span>
        } @else {
          <span>Guardar i continuar</span>
        }
      </button>

    </div>
  </div>
</div>
