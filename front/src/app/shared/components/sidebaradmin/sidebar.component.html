<nav class="barra-superior">
  <div class="seccio-esquerra">
    <div class="logo">
      <!-- Espai per logotip si cal -->
    </div>

    <div class="enllacos-navegacio">
      <!-- Inici -->
      <a
        routerLink="/administracio"
        routerLinkActive="actiu"
        [routerLinkActiveOptions]="{ exact: true }"
        class="element-navegacio"
      >
        <div class="caixa-icona">
          <img src="/img/menu/iconos/inici-icona.png" alt="Inici" />
        </div>
        <span>Inici</span>
      </a>

      <!-- Assignatures → nova icona -->
      <a routerLink="/admin-assignatures" routerLinkActive="actiu" class="element-navegacio">
        <div class="caixa-icona">
          <img src="/img/menu/iconos/assignatures-icona.png" alt="Assignatures" />
        </div>
        <span>Assignatures</span>
      </a>

      <!-- Usuaris → nova icona -->
      <a routerLink="/admin-usuaris" routerLinkActive="actiu" class="element-navegacio">
        <div class="caixa-icona">
          <img src="/img/menu/iconos/llista-icona.png" alt="Usuaris" />
        </div>
        <span>Usuaris</span>
      </a>

      <!-- Periodes / Cursos -->
      <a routerLink="/admin-periodes" routerLinkActive="actiu" class="element-navegacio">
        <div class="caixa-icona">
          <img src="/img/menu/iconos/calendari-icona.png" alt="Periodes" />
        </div>
        <span>Periodes</span>
      </a>

      <!-- Classes -->
      <a routerLink="/admin-classes" routerLinkActive="actiu" class="element-navegacio">
        <div class="caixa-icona">
          <img src="/img/menu/iconos/justif-icona.png" alt="Classes" />
        </div>
        <span>Classes</span>
      </a>
    </div>
  </div>

  <!-- Icona Perfil -->
  <div class="seccio-perfil">
    <a routerLink="/profile" class="element-navegacio">
      <div class="caixa-icona perfil">
        <img src="/img/menu/iconos/usuari-icona.png" alt="Perfil" />
      </div>
    </a>
  </div>
</nav>
