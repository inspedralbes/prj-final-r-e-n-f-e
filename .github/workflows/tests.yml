name: Run Full Test Suite

on:
  pull_request:
    branches: [dev, pre-prod]

jobs:
  test:
    name: Full Stack Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Setup Node (frontend + Cypress)
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      # -------------------------
      # Setup PHP (Laravel)
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      # -------------------------
      # Install backend deps
      # -------------------------
      - name: Install Laravel dependencies
        working-directory: back/laravel-api
        run: composer install --no-interaction --prefer-dist --no-progress

      # -------------------------
      # Prepare Laravel testing env
      # -------------------------
      - name: Prepare Laravel environment
        working-directory: back/laravel-api
        run: |
          cp .env.example .env || true
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
          php artisan key:generate

      # -------------------------
      # Run Laravel tests
      # -------------------------
      - name: Run Laravel tests
        working-directory: back/laravel-api
        run: php artisan test

      # -------------------------
      # Install frontend deps
      # -------------------------
      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      # -------------------------
      # Start full stack (Docker + Frontend)
      # -------------------------
      - name: Start services (Docker)
        run: docker compose -f compose.TEST.yml up -d --build

      - name: Start frontend
        working-directory: front
        run: |
          npm run generate-env
          npm run start &

      - name: Wait 30s for services to stabilize
        run: sleep 30

      - name: Debug containers
        run: docker ps

      - name: Debug logs backend
        run: docker logs pfg1-back

      - name: Debug logs nginx
        run: docker logs pfg1-nginx

      # -------------------------
      # Wait for services (IMPORTANT)
      # -------------------------
      # - name: Wait for backend & frontend
      #   run: |
      #     npx wait-on http://localhost:8000 --timeout 60000
      #     npx wait-on http://localhost:4200 --timeout 120000

      # -------------------------
      # Run Cypress E2E tests
      # -------------------------
      - name: Run Cypress tests
        working-directory: front
        run: npm run test:e2e

      # -------------------------
      # Stop services
      # -------------------------
      - name: Stop services
        if: always()
        run: docker compose -f compose.TEST.yml down
