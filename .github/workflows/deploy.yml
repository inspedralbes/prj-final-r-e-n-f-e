name: Deploy and Update Services

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Full Deploy Process
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSHKEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add to Known Hosts
        run: |
          echo "Connecting to server ${{ secrets.SERVER_HOST }}..."
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Update, Configure and Deploy
        run: |
          ssh -o ServerAliveCountMax=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} bash -s << 'EOF'
            set -euo pipefail

            cd /
            # Anar a la carpeta del projecte (o clonar si no existeix)
            if [ ! -d "prj-final-r-e-n-f-e/.git" ]; then
              echo "Projecte no trobat, clonant repositori..."
              git clone --branch main https://github.com/inspedralbes/prj-final-r-e-n-f-e.git
            fi
            cd prj-final-r-e-n-f-e

            # Baixar els últims canvis del codi
            echo "Baixant canvis de Git..."
            git pull origin main

            # Crear .env /
            echo "Crear .env /..."
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_DEFAULT_PASSWORD }}" >> .env

            # Crear .env.PROD FRONT
            echo "Creant .env.PROD FRONT..."
            cd front
            cp .env.PROD .env
            cd ..

            # Crear .env.PROD BACK laravel-api
            cd ./back/laravel-api
            echo "Copiant .env.PROD de Back laravel-api..."
            cp .env.PROD .env
            ls -l /prj-final-r-e-n-f-e/back/laravel-api/.env
            echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
            echo "DB_CONNECTION=pgsql" >> .env
            echo "DB_HOST=pfg1-postgres" >> .env
            echo "DB_PORT=5432" >> .env
            echo "DB_DATABASE=prf-renfe" >> .env
            echo "DB_USERNAME=postgres" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
            echo "" >> .env
            echo "MAIL_MAILER=smtp" >> .env
            echo "MAIL_HOST=smtp.tenfe.cat" >> .env
            echo "MAIL_PORT=587" >> .env
            echo "MAIL_USERNAME=info@tenfe.cat" >> .env
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
            echo "MAIL_ENCRYPTION=tls" >> .env
            echo "MAIL_FROM_ADDRESS=info@tenfe.cat" >> .env
            echo 'MAIL_FROM_NAME=${APP_NAME}' >> .env
            NODE_PRINCIPAL_API_URL=https://tenfe.cat/back-node
            cd ../..

            # Crear .env BACK Principal-node
            echo "Creant .env BACK Principal-node..."
            cd ./back/principal-node
            cp .env.PROD .env
            cd ../..

            # Crear directorios de Laravel que no existen en git (storage y cache)
            echo "Creando directorios de Laravel..."
            mkdir -p back/laravel-api/storage/framework/{cache,sessions,views}
            mkdir -p back/laravel-api/storage/logs
            mkdir -p back/laravel-api/bootstrap/cache
            chmod -R 775 back/laravel-api/storage back/laravel-api/bootstrap/cache

            # Configuració inicial (abans de validar certificats)
            cp nginx-init.conf nginx.conf
            echo "Utilitzant configuració INICIAL abans de validar certificats"

            # Aixecar contenidors reconstruint la imatge
            echo " Construint i aixecant contenidors..."
            docker compose -f compose.PROD.yml up --build -d

            # Reiniciar nginx per forçar que carregui nginx-init.conf
            echo "Reiniciant nginx per aplicar configuració INICIAL..."
            docker compose -f compose.PROD.yml restart pfg1-nginx

            # Esperar que certbot generi els certificats (fins a 60s)
            echo "Esperant certificats SSL..."
            i=0
            while [ $i -lt 30 ]; do
              if [ -f certbot/conf/live/tenfe.cat/fullchain.pem ] && [ -f certbot/conf/live/tenfe.cat/privkey.pem ]; then
                echo "✓ Certificats SSL trobats després de ${i}s"
                break
              fi
              sleep 2
              i=$((i + 1))
            done

            # Mostrar logs de certbot
            echo "Mostrant logs de certbot..."
            docker compose -f compose.PROD.yml logs certbot

            # Comprovar si existeixen certificats i aplicar configuració final
            if [ -f certbot/conf/live/tenfe.cat/fullchain.pem ]; then
              cp nginx-prod.conf nginx.conf
              echo "✓ Certificats SSL trobats - canviant a configuració de PROD"
              echo "Reiniciant nginx per aplicar la nova configuració..."
              docker compose -f compose.PROD.yml restart pfg1-nginx
            else
              echo "⚠ Encara no hi ha certificats SSL - es manté configuració INICIAL"
              echo "⚠ Pots executar manualment:"
              echo "  cd /prj-final-r-e-n-f-e && docker compose -f compose.PROD.yml run --rm certbot certonly --webroot --webroot-path /var/www/certbot -d tenfe.cat"
            fi
          EOF
