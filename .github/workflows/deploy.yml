name: Deploy and Update Services

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Backend Dependencies
        working-directory: back/laravel-api
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install Frontend Dependencies
        working-directory: front
        run: npm install

      - name: Run Laravel Tests
        working-directory: back/laravel-api
        run: php artisan test

      - name: Start Services for E2E Tests
        run: |
          docker compose -f compose.TEST.yml up -d
          cd front
          npm run start &
          npx wait-on http://localhost:4200 --timeout 60000

      - name: Run Cypress Tests
        working-directory: front
        run: npm run test:e2e

      - name: Stop Services
        if: always()
        run: docker compose -f compose.TEST.yml down

  deploy:
    name: Full Deploy Process
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSHKEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add to Known Hosts
        run: |
          echo "Connecting to server ${{ secrets.SERVER_HOST }}..."
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Update, Configure and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} bash -s << 'EOF'
            set -euo pipefail

            cd /
            if [ ! -d "prj-final-r-e-n-f-e/.git" ]; then
              echo "Projecte no trobat, clonant repositori..."
              git clone --branch main https://github.com/inspedralbes/prj-final-r-e-n-f-e.git
            fi
            cd prj-final-r-e-n-f-e

            echo "Baixant canvis de Git..."
            git pull origin main

            echo "Crear .env /..."
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" > .env
            echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "PGADMIN_DEFAULT_PASSWORD=${{ secrets.PGADMIN_DEFAULT_PASSWORD }}" >> .env

            echo "Creant .env.PROD FRONT..."
            cd front
            cp .env.PROD .env
            cd ..

            cd ./back/laravel-api
            echo "Copiant .env.PROD de Back laravel-api..."
            cp .env.PROD .env
            echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
            echo "DB_CONNECTION=pgsql" >> .env
            echo "DB_HOST=pfg1-postgres" >> .env
            echo "DB_PORT=5432" >> .env
            echo "DB_DATABASE=prf-renfe" >> .env
            echo "DB_USERNAME=postgres" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
            echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}" >> .env
            echo "" >> .env
            echo "MAIL_MAILER=smtp" >> .env
            echo "MAIL_HOST=smtp.tenfe.cat" >> .env
            echo "MAIL_PORT=587" >> .env
            echo "MAIL_USERNAME=info@tenfe.cat" >> .env
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" >> .env
            echo "MAIL_ENCRYPTION=tls" >> .env
            echo "MAIL_FROM_ADDRESS=info@tenfe.cat" >> .env
            echo 'MAIL_FROM_NAME=${APP_NAME}' >> .env
            cd ../..

            echo "Creant .env BACK Principal-node..."
            cd ./back/principal-node
            cp .env.PROD .env
            cd ../..

            echo "Creando directorios de Laravel..."
            mkdir -p back/laravel-api/storage/framework/{cache,sessions,views}
            mkdir -p back/laravel-api/storage/logs
            mkdir -p back/laravel-api/bootstrap/cache
            chmod -R 775 back/laravel-api/storage back/laravel-api/bootstrap/cache

            cp nginx-init.conf nginx.conf
            echo "Utilitzant configuració INICIAL abans de validar certificats"

            echo " Construint i aixecant contenidors..."
            docker compose -f compose.PROD.yml up --build -d

            if ls certbot/conf/live/tenfe.cat/fullchain.pem certbot/conf/live/tenfe.cat/privkey.pem >/dev/null 2>&1; then
              cp nginx-prod.conf nginx.conf
              echo "✓ Certificats SSL trobats - canviant a configuració de PROD"
              docker compose -f compose.PROD.yml restart
            else
              echo "⚠ Encara no hi ha certificats SSL - es manté configuració INICIAL"
            fi
          EOF
