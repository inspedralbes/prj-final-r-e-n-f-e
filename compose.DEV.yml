  pfg1-postgres:
    image: postgres:16
    container_name: pfg1-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: prf-renfe
    volumes:
      - postgres-bd:/var/lib/postgresql/data:rw
    ports:
      - 5432:5432
    networks:
      - general

  pfg1-pgadmin:
    image: dpage/pgadmin4
    container_name: pfg1-pgadmin
    restart: always
    ports:
      - 8080:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - pfg1-postgres
    networks:
      - general

