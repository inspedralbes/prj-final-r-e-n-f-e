## docker compose -f compose.DEV.yml up --build

## docker compose exec pfg1-back php artisan migrate:fresh --seed

## docker exec pfg1-back php artisan db:seed
services:
  # Frontend Angular
  pfg1-front:
    container_name: pfg1-front
    image: node:24-bullseye
    command: sh -c "cp .env.DEV .env && npm run generate-env && npm install && npm start -- --host 0.0.0.0 --poll 2000"
    working_dir: /usr/src/app
    volumes:
      - ./front:/usr/src/app
    ports:
      - "4200:4200"
    # links:
    #   - pfg1-back
    networks:
      - general

  # Backend Laravel
  pfg1-back:
    container_name: pfg1-back
    build:
      context: .
      dockerfile: ./back/laravel-api/dev.Dockerfile
    ports:
      - 9000:9000
    volumes:
      - ./back/laravel-api:/app
    depends_on:
      - pfg1-postgres
    # entrypoint: ["/bin/sh", "-c"]
    command: sh -c "cp /app/.env.DEV /app/.env && php artisan migrate && php artisan key:generate && php artisan storage:link || true && php-fpm"
    networks:
      - general

  # Servei de cua
  pfg1-worker:
    container_name: pfg1-worker
    build:
      context: .
      dockerfile: ./back/laravel-api/dev.Dockerfile
    volumes:
      - ./back/laravel-api:/app
    depends_on:
      - pfg1-postgres
      - pfg1-back
    command: sh -c "php artisan queue:work --verbose --tries=3"
    networks:
      - general
    restart: unless-stopped

  # Nginx
  pfg1-nginx:
    container_name: pfg1-nginx
    image: nginx:latest
    ports:
      - "8000:8000"
    volumes:
      - ./back/laravel-api/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./back/laravel-api:/app
    depends_on:
      pfg1-back:
        condition: service_started
    networks:
      - general
    restart: unless-stopped

  # Backend Principal nodejs
  pfg1-back-node:
    container_name: pfg1-back-node
    build:
      dockerfile: ./back/principal-node/dev.Dockerfile
      context: .
    command: sh -c "cp .env.DEV .env && npm install && nodemon -L index.js"
    volumes:
      - ./back/principal-node:/usr/src/app
    ports:
      - "3000:3000"
    working_dir: /usr/src/app
    depends_on:
      - pfg1-back
    networks:
      - general

